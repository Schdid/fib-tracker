name: poll-fibs

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}      # allow manual run from the Actions tab

permissions:
  contents: write            # needed to commit data/state.json back

concurrency:
  group: poll-fibs
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run worker
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO:          ${{ secrets.NOTIFY_TO }}
        run: python worker.py

      - name: Commit updated state
        run: |
          git config user.name  "fib-tracker-bot"
          git config user.email "fib-tracker-bot@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "data: refresh fib-tracker state [skip ci]"
            git push
          fi
